kind = "web"
previewPath = "/"
title = "Gestão Kids"
version = "1.0.0"
id = "artifacts/gestao-kids"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.env]
PORT = "5173"
BASE_PATH = "/"

[services.development]
run = "PORT=5173 BASE_PATH=/ pnpm --filter @workspace/gestao-kids run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gestao-kids", "run", "build" ]
publicDir = "artifacts/gestao-kids/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
