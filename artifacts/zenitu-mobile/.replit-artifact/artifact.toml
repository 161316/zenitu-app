kind = "mobile"
previewPath = "/zenitu-mobile/"
title = "Zenitu Mobile"
version = "1.0.0"
id = "artifacts/zenitu-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/zenitu-mobile/" ]
localPort = 20210

[services.development]
run = "pnpm --filter @workspace/zenitu-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zenitu-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/zenitu-mobile", "run", "serve" ]

[services.env]
PORT = "20210"
BASE_PATH = "/zenitu-mobile/"
